{{extend 'layout.html'}}

<style>
.ai-chatbot {
	box-sizing: border-box;
	display: flex;
	flex-direction: column;
	height: calc(100vh - 6em);
	margin: 0;
	padding: 1em;
	width: 100%;
}
.ai-chatbot > h2 {
	margin: 0 0 0.8em 0;
}
.ai-chat-layout {
	display: flex;
	flex: 1 1 auto;
	gap: 1em;
	min-height: 0;
	min-width: 0;
	overflow: hidden;
}
.ai-chat-history {
	background: #f7f7f7;
	border: 1px solid lightgray;
	border-radius: 3px;
	display: flex;
	flex: 0 0 18em;
	flex-direction: column;
	max-width: 18em;
	min-height: 0;
	min-width: 18em;
	overflow: hidden;
	width: 18em;
}
.ai-chat-history-header {
	align-items: center;
	background: #2d2d2d;
	color: whitesmoke;
	display: flex;
	font-weight: bold;
	justify-content: space-between;
	padding: 0.7em 0.8em;
}
.ai-chat-new {
	background: #fff;
	border: 1px solid #bbb;
	border-radius: 3px;
	color: #222;
	cursor: pointer;
	font-weight: bold;
	line-height: 1;
	padding: 0.2em 0.55em;
}
.ai-chat-history-list {
	flex: 1 1 auto;
	min-height: 0;
	overflow-y: auto;
	padding: 0.6em;
}
.ai-chat-history-empty {
	color: #666;
	padding: 0.6em;
}
.ai-chat-history-item {
	align-items: center;
	background: #fff;
	border: 1px solid #ddd;
	border-radius: 3px;
	cursor: pointer;
	display: flex;
	gap: 0.4em;
	margin-bottom: 0.45em;
	min-width: 0;
	padding: 0.55em;
}
.ai-chat-history-item.active {
	background: #E5FFE5;
	border-color: #96c696;
}
.ai-chat-history-title {
	flex: 1 1 auto;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.ai-chat-history-delete {
	background: transparent;
	border: 0;
	color: #777;
	cursor: pointer;
	flex: 0 0 auto;
	font-size: 1.1em;
	line-height: 1;
	padding: 0.1em 0.25em;
}
.ai-chat-history-delete:hover {
	color: #9a1f1f;
}
.ai-chatbox {
	background: #fff;
	border: 1px solid lightgray;
	border-radius: 3px;
	box-shadow: inset 0 1px 0 rgba(0,0,0,0.05);
	display: flex;
	flex: 1 1 auto;
	flex-direction: column;
	min-height: 0;
	min-width: 0;
}
.ai-chatbox-header {
	background: #2d2d2d;
	color: whitesmoke;
	padding: 0.7em 1em;
	font-weight: bold;
}
.ai-chatbox-body {
	display: flex;
	flex: 1 1 auto;
	flex-direction: column;
	min-height: 0;
	padding: 1em;
}
.ai-chat-messages {
	flex: 1 1 auto;
	min-height: 0;
	overflow-y: auto;
	background: #fafaf4;
	border: 1px solid #ddd;
	padding: 0.8em;
	min-width: 0;
}
.ai-chat-message {
	margin-bottom: 0.8em;
}
.ai-chat-message-label {
	color: #555;
	font-weight: bold;
	margin-bottom: 0.2em;
}
.ai-chat-message-content {
	background: #fff;
	border: 1px solid #ddd;
	border-radius: 3px;
	overflow-wrap: anywhere;
	padding: 0.7em;
	word-break: break-word;
}
.ai-chat-message.user .ai-chat-message-content {
	white-space: pre-wrap;
}
.ai-chat-message.assistant .ai-chat-message-content {
	background: #E5FFE5;
	white-space: pre-wrap;
}
.ai-chat-message.assistant .ai-chat-message-content.rendered {
	white-space: normal;
}
.ai-chat-message.assistant .ai-chat-message-content.thinking {
	align-items: center;
	color: #4d684d;
	display: inline-flex;
	font-style: italic;
	gap: 0.25em;
	min-height: 1.4em;
	white-space: normal;
}
.ai-chat-thinking-dots {
	display: inline-flex;
	gap: 0.18em;
}
.ai-chat-thinking-dot {
	animation: ai-chat-thinking-pulse 1.15s infinite ease-in-out;
	background: #4d684d;
	border-radius: 50%;
	display: inline-block;
	height: 0.38em;
	opacity: 0.35;
	width: 0.38em;
}
.ai-chat-thinking-dot:nth-child(2) {
	animation-delay: 0.16s;
}
.ai-chat-thinking-dot:nth-child(3) {
	animation-delay: 0.32s;
}
@keyframes ai-chat-thinking-pulse {
	0%, 80%, 100% {
		opacity: 0.35;
		transform: translateY(0);
	}
	40% {
		opacity: 1;
		transform: translateY(-0.18em);
	}
}
.ai-chat-message.assistant .ai-chat-message-content p {
	margin: 0.4em 0;
}
.ai-chat-message.assistant .ai-chat-message-content h1,
.ai-chat-message.assistant .ai-chat-message-content h2,
.ai-chat-message.assistant .ai-chat-message-content h3,
.ai-chat-message.assistant .ai-chat-message-content h4 {
	margin: 0.8em 0 0.4em 0;
}
.ai-chat-message.assistant .ai-chat-message-content h1:first-child,
.ai-chat-message.assistant .ai-chat-message-content h2:first-child,
.ai-chat-message.assistant .ai-chat-message-content h3:first-child,
.ai-chat-message.assistant .ai-chat-message-content h4:first-child,
.ai-chat-message.assistant .ai-chat-message-content p:first-child {
	margin-top: 0;
}
.ai-chat-message.assistant .ai-chat-message-content table {
	border-collapse: collapse;
	margin: 0.8em 0;
	width: 100%;
}
.ai-chat-message.assistant .ai-chat-message-content th,
.ai-chat-message.assistant .ai-chat-message-content td {
	border: 1px solid #b7d6b7;
	padding: 0.4em 0.55em;
	text-align: left;
	vertical-align: top;
}
.ai-chat-message.assistant .ai-chat-message-content th {
	background: #d2f0d2;
}
.ai-chat-message.assistant .ai-chat-message-content code {
	background: rgba(0,0,0,0.08);
	border-radius: 3px;
	padding: 0.05em 0.25em;
}
.ai-chat-message.assistant .ai-chat-message-content pre {
	background: rgba(0,0,0,0.08);
	border: 1px solid #b7d6b7;
	border-radius: 3px;
	overflow-x: auto;
	padding: 0.7em;
	white-space: pre;
}
.ai-chat-message.assistant .ai-chat-message-content pre code {
	background: transparent;
	padding: 0;
}
.ai-chat-message.assistant .ai-chat-message-content ul,
.ai-chat-message.assistant .ai-chat-message-content ol {
	margin: 0.4em 0 0.7em 1.6em;
	padding: 0;
}
.ai-chat-tools {
	background: #f8f8f8;
	border: 1px solid #ddd;
	border-radius: 3px;
	margin-top: 0.4em;
	padding: 0.55em 0.7em;
}
.ai-chat-tools summary {
	cursor: pointer;
	font-weight: bold;
}
.ai-chat-tool {
	border-top: 1px solid #ddd;
	margin-top: 0.5em;
	padding-top: 0.5em;
}
.ai-chat-tool-name {
	font-weight: bold;
}
.ai-chat-tool-status {
	color: #555;
	margin-left: 0.5em;
}
.ai-chat-tool-status.ok {
	color: #247424;
}
.ai-chat-tool-status.error {
	color: #9a1f1f;
}
.ai-chat-form {
	display: flex;
	gap: 0.8em;
	margin-top: 1em;
	align-items: flex-end;
	min-width: 0;
}
.ai-chat-form textarea {
	flex: 1 1 auto;
	min-width: 0;
	min-height: 6em;
	resize: vertical;
	border: 1px solid lightgray;
	border-radius: 3px;
	padding: 0.7em;
	font-family: inherit;
}
.ai-chat-form button {
	background: #2d2d2d;
	color: whitesmoke;
	border: 1px solid #1f1f1f;
	border-radius: 3px;
	padding: 0.7em 1.2em;
	min-width: 8em;
}
.ai-chat-form button:disabled {
	background: #888;
	border-color: #777;
}
.ai-chat-error {
	display: none;
	margin-top: 1em;
}
.ai-chat-status {
	color: #555;
	margin-top: 0.7em;
	min-height: 1.3em;
}
@media (max-width: 700px) {
	.ai-chatbot {
		height: auto;
		min-height: auto;
		padding: 0.7em;
	}
	.ai-chat-layout {
		display: block;
	}
	.ai-chat-history {
		margin-bottom: 0.8em;
		max-height: 16em;
	}
	.ai-chat-form {
		display: block;
	}
	.ai-chat-form button {
		margin-top: 0.7em;
		width: 100%;
	}
}
</style>

<div class="ai-chatbot">
	<h2>{{=T("AI Assistant")}}</h2>
	<div class="ai-chat-layout">
		<div class="ai-chat-history">
			<div class="ai-chat-history-header">
				<span>{{=T("History")}}</span>
				<button id="ai-chat-new" class="ai-chat-new" type="button" title="{{=T('New conversation')}}">+</button>
			</div>
			<div id="ai-chat-history-list" class="ai-chat-history-list"></div>
		</div>
		<div class="ai-chatbox">
			<div class="ai-chatbox-header">{{=T("OpenSVC AI chatbot")}}</div>
			<div class="ai-chatbox-body">
				<div id="ai-chat-messages" class="ai-chat-messages"></div>
				<form id="ai-chat-form" class="ai-chat-form">
					<textarea id="ai-chat-input" placeholder="{{=T('Ask a question about your OpenSVC environment')}}"></textarea>
					<button id="ai-chat-submit" type="submit">{{=T("Send")}}</button>
				</form>
				<div id="ai-chat-status" class="ai-chat-status"></div>
				<div id="ai-chat-error" class="error ai-chat-error"></div>
			</div>
		</div>
	</div>
</div>

<script>
(function() {
	var conversationsUrl = "{{=URL('ai', 'conversations')}}";
	var currentConversationId = null;
	var conversations = [];
	var form = $("#ai-chat-form");
	var input = $("#ai-chat-input");
	var button = $("#ai-chat-submit");
	var messages = $("#ai-chat-messages");
	var historyList = $("#ai-chat-history-list");
	var newButton = $("#ai-chat-new");
	var status = $("#ai-chat-status");
	var error = $("#ai-chat-error");
	var responseTimerStartedAt = null;
	var responseTimerInterval = null;
	var responseTimerMessage = "";

	function appendMessage(role, text, toolCalls) {
		var msg = $("<div>").addClass("ai-chat-message").addClass(role);
		var label = $("<div>").addClass("ai-chat-message-label");
		var content = $("<div>").addClass("ai-chat-message-content");
		label.text(role == "user" ? "{{=T('You')}}" : "{{=T('Assistant')}}");
		if (role == "assistant") {
			renderAssistantMessage(content, text);
		} else {
			content.text(text);
		}
		msg.append(label).append(content);
		if (role == "assistant") {
			appendToolCalls(msg, toolCalls);
		}
		messages.append(msg);
		messages.scrollTop(messages.prop("scrollHeight"));
		return msg;
	}

	function setAssistantMessageText(messageElement, text) {
		var content = messageElement.find(".ai-chat-message-content").first();
		renderAssistantMessage(content, text);
		messages.scrollTop(messages.prop("scrollHeight"));
	}

	function setAssistantMessageThinking(messageElement, text) {
		var content = messageElement.find(".ai-chat-message-content").first();
		var dots = $("<span>").addClass("ai-chat-thinking-dots");
		content
			.removeClass("rendered")
			.addClass("thinking")
			.empty()
			.append($("<span>").text(text || "{{=T('Thinking')}}"))
			.append(dots);
		dots
			.append($("<span>").addClass("ai-chat-thinking-dot"))
			.append($("<span>").addClass("ai-chat-thinking-dot"))
			.append($("<span>").addClass("ai-chat-thinking-dot"));
		messages.scrollTop(messages.prop("scrollHeight"));
	}

	function startResponseTimer(message) {
		stopResponseTimer(false);
		responseTimerStartedAt = new Date().getTime();
		responseTimerMessage = message;
		updateResponseTimerStatus();
		responseTimerInterval = window.setInterval(updateResponseTimerStatus, 250);
	}

	function setResponseTimerMessage(message) {
		if (!responseTimerStartedAt) {
			status.text(message);
			return;
		}
		responseTimerMessage = message;
		updateResponseTimerStatus();
	}

	function stopResponseTimer(clearStatus) {
		if (responseTimerInterval) {
			window.clearInterval(responseTimerInterval);
		}
		responseTimerInterval = null;
		responseTimerStartedAt = null;
		responseTimerMessage = "";
		if (clearStatus) {
			status.text("");
		}
	}

	function updateResponseTimerStatus() {
		var elapsedSeconds;
		if (!responseTimerStartedAt) {
			return;
		}
		elapsedSeconds = Math.floor(
			(new Date().getTime() - responseTimerStartedAt) / 1000
		);
		status.text(responseTimerMessage + " " + elapsedSeconds + "s");
	}

	function clearMessages() {
		messages.empty();
	}

	function conversationUrl(conversationId, suffix) {
		var url = conversationsUrl + "/" + encodeURIComponent(conversationId);
		if (suffix) {
			url += "/" + suffix;
		}
		return url;
	}

	function renderConversations() {
		historyList.empty();

		if (conversations.length === 0) {
			historyList.append(
				$("<div>")
					.addClass("ai-chat-history-empty")
					.text("{{=T('No conversation yet')}}")
			);
			return;
		}

		$.each(conversations, function(_, conversation) {
			var item = $("<div>").addClass("ai-chat-history-item");
			var title = $("<div>").addClass("ai-chat-history-title");
			var remove = $("<button>")
				.addClass("ai-chat-history-delete")
				.attr("type", "button")
				.attr("title", "{{=T('Delete conversation')}}")
				.text("x");

			if (conversation.id == currentConversationId) {
				item.addClass("active");
			}
			title.text(conversation.title || "{{=T('New conversation')}}");
			item.append(title).append(remove);
			item.on("click", function() {
				selectConversation(conversation.id);
			});
			remove.on("click", function(event) {
				event.stopPropagation();
				deleteConversation(conversation.id);
			});
			historyList.append(item);
		});
	}

	function loadConversations() {
		return $.ajax({
			url: conversationsUrl,
			method: "GET",
			dataType: "json",
			success: function(data) {
				var found = false;
				conversations = data.conversations || [];
				$.each(conversations, function(_, conversation) {
					if (conversation.id == currentConversationId) {
						found = true;
					}
				});
				if (currentConversationId && !found) {
					currentConversationId = null;
				}
				renderConversations();
				if (!currentConversationId && conversations.length > 0) {
					selectConversation(conversations[0].id);
				} else if (!currentConversationId) {
					clearMessages();
				}
			},
			error: function(xhr) {
				error.text(errorText(xhr)).show();
			}
		});
	}

	function selectConversation(conversationId) {
		currentConversationId = conversationId;
		renderConversations();
		setBusy(true, "{{=T('Loading conversation...')}}");
		error.hide().text("");
		$.ajax({
			url: conversationUrl(conversationId, "messages"),
			method: "GET",
			dataType: "json",
			success: function(data) {
				clearMessages();
				$.each(data.messages || [], function(_, message) {
					appendMessage(
						message.role,
						message.content || "",
						message.tool_calls
					);
				});
			},
			error: function(xhr) {
				error.text(errorText(xhr)).show();
			},
			complete: function() {
				setBusy(false);
				input.focus();
			}
		});
	}

	function deleteConversation(conversationId) {
		if (!window.confirm("{{=T('Delete this conversation?')}}")) {
			return;
		}
		setBusy(true, "{{=T('Deleting conversation...')}}");
		error.hide().text("");
		$.ajax({
			url: conversationUrl(conversationId),
			method: "DELETE",
			dataType: "json",
			success: function() {
				if (conversationId == currentConversationId) {
					currentConversationId = null;
					clearMessages();
				}
				loadConversations();
			},
			error: function(xhr) {
				error.text(errorText(xhr)).show();
			},
			complete: function() {
				setBusy(false);
				input.focus();
			}
		});
	}

	function createConversation(title) {
		return $.ajax({
			url: conversationsUrl,
			method: "POST",
			contentType: "application/json",
			dataType: "json",
			data: JSON.stringify({
				title: title
			})
		}).then(function(data) {
			currentConversationId = data.conversation.id;
			conversations.unshift(data.conversation);
			return data.conversation;
		});
	}

	function appendToolCalls(message, toolCalls) {
		var normalized = normalizeCollectorToolCalls(toolCalls);
		if (normalized.length === 0) {
			return;
		}

		var details = $("<details>").addClass("ai-chat-tools");
		var summary = $("<summary>");
		summary.text(
			normalized.length == 1 ?
			"Collector tool used" :
			"Collector tools used (" + normalized.length + ")"
		);
		details.append(summary);

		$.each(normalized, function(_, tool) {
			var item = $("<div>").addClass("ai-chat-tool");
			var name = $("<span>").addClass("ai-chat-tool-name");
			var status = $("<span>").addClass("ai-chat-tool-status");

			name.text(tool.name);
			status.addClass(tool.ok ? "ok" : "error");
			status.text(tool.ok ? "ok" : "error");

			item.append(name).append(status);
			details.append(item);
		});

		message.append(details);
	}

	function normalizeCollectorToolCalls(toolCalls) {
		var normalized = [];
		if (!$.isArray(toolCalls)) {
			return normalized;
		}

		$.each(toolCalls, function(_, toolCall) {
			var args;
			var collectorToolName;

			if (!toolCall || typeof toolCall != "object") {
				return;
			}
			args = toolCall.arguments || {};
			if (toolCall.name == "search_tools") {
				return;
			}
			if (toolCall.name == "call_tool") {
				collectorToolName = args.name;
				if (!collectorToolName) {
					return;
				}
				normalized.push({
					name: collectorToolName,
					ok: toolCall.ok !== false
				});
				return;
			}
			normalized.push({
				name: toolCall.name || "unknown_tool",
				ok: toolCall.ok !== false
			});
		});

		return normalized;
	}

	function renderAssistantMessage(content, text) {
		content.removeClass("thinking");
		content.html(sanitizeMarkdownHtml(renderMarkdown(text)));
		content.addClass("rendered");
	}

	function escapeHtml(text) {
		return String(text).replace(/[&<>"']/g, function(chr) {
			return {
				"&": "&amp;",
				"<": "&lt;",
				">": "&gt;",
				"\"": "&quot;",
				"'": "&#39;"
			}[chr];
		});
	}

	function renderMarkdown(text) {
		var lines = escapeHtml(text).split(/\r?\n/);
		var html = [];
		var paragraph = [];
		var i = 0;

		function flushParagraph() {
			if (paragraph.length === 0) {
				return;
			}
			html.push("<p>" + renderInlineMarkdown(paragraph.join(" ")) + "</p>");
			paragraph = [];
		}

		while (i < lines.length) {
			var line = lines[i];
			var trimmed = $.trim(line);
			var heading = trimmed.match(/^(#{1,6})\s+(.+)$/);

			if (trimmed === "") {
				flushParagraph();
				i += 1;
				continue;
			}

			if (/^```/.test(trimmed)) {
				var code = [];
				flushParagraph();
				i += 1;
				while (i < lines.length && !/^```/.test($.trim(lines[i]))) {
					code.push(lines[i]);
					i += 1;
				}
				if (i < lines.length) {
					i += 1;
				}
				html.push("<pre><code>" + code.join("\n") + "</code></pre>");
				continue;
			}

			if (isTableHeader(lines, i)) {
				var headers = splitTableRow(lines[i]);
				var rows = [];
				flushParagraph();
				i += 2;

				while (i < lines.length && isTableRow(lines[i], headers.length)) {
					rows.push(splitTableRow(lines[i]));
					i += 1;
				}

				html.push(buildTableHtml(headers, rows));
				continue;
			}

			if (heading) {
				var level = heading[1].length;
				flushParagraph();
				html.push(
					"<h" + level + ">" +
					renderInlineMarkdown(heading[2]) +
					"</h" + level + ">"
				);
				i += 1;
				continue;
			}

			if (/^[-*]\s+/.test(trimmed)) {
				flushParagraph();
				html.push("<ul>");
				while (i < lines.length && /^[-*]\s+/.test($.trim(lines[i]))) {
					html.push(
						"<li>" +
						renderInlineMarkdown($.trim(lines[i]).replace(/^[-*]\s+/, "")) +
						"</li>"
					);
					i += 1;
				}
				html.push("</ul>");
				continue;
			}

			if (/^\d+\.\s+/.test(trimmed)) {
				flushParagraph();
				html.push("<ol>");
				while (i < lines.length && /^\d+\.\s+/.test($.trim(lines[i]))) {
					html.push(
						"<li>" +
						renderInlineMarkdown($.trim(lines[i]).replace(/^\d+\.\s+/, "")) +
						"</li>"
					);
					i += 1;
				}
				html.push("</ol>");
				continue;
			}

			if (/^>\s+/.test(trimmed)) {
				var quote = [];
				flushParagraph();
				while (i < lines.length && /^>\s+/.test($.trim(lines[i]))) {
					quote.push($.trim(lines[i]).replace(/^>\s+/, ""));
					i += 1;
				}
				html.push(
					"<blockquote><p>" +
					renderInlineMarkdown(quote.join(" ")) +
					"</p></blockquote>"
				);
				continue;
			}

			paragraph.push(trimmed);
			i += 1;
		}

		flushParagraph();
		return html.join("");
	}

	function isTableHeader(lines, index) {
		if (index + 1 >= lines.length || lines[index].indexOf("|") == -1) {
			return false;
		}
		var headers = splitTableRow(lines[index]);
		if (headers.length < 2) {
			return false;
		}
		return isTableDivider(lines[index + 1], headers.length);
	}

	function splitTableRow(line) {
		var row = $.trim(line);
		if (row.charAt(0) == "|") {
			row = row.substring(1);
		}
		if (row.charAt(row.length - 1) == "|") {
			row = row.substring(0, row.length - 1);
		}
		return $.map(row.split("|"), function(cell) {
			return $.trim(cell);
		});
	}

	function isTableDivider(line, columns) {
		var cells = splitTableRow(line);
		if (cells.length != columns) {
			return false;
		}
		for (var i = 0; i < cells.length; i++) {
			if (!/^:?-{3,}:?$/.test(cells[i])) {
				return false;
			}
		}
		return true;
	}

	function isTableRow(line, columns) {
		if ($.trim(line) === "" || line.indexOf("|") == -1) {
			return false;
		}
		return splitTableRow(line).length == columns;
	}

	function buildTableHtml(headers, rows) {
		var html = ["<table><thead><tr>"];
		for (var i = 0; i < headers.length; i++) {
			html.push("<th>" + renderInlineMarkdown(headers[i]) + "</th>");
		}
		html.push("</tr></thead><tbody>");
		for (var r = 0; r < rows.length; r++) {
			html.push("<tr>");
			for (var c = 0; c < headers.length; c++) {
				html.push("<td>" + renderInlineMarkdown(rows[r][c] || "") + "</td>");
			}
			html.push("</tr>");
		}
		html.push("</tbody></table>");
		return html.join("");
	}

	function renderInlineMarkdown(text) {
		return String(text)
			.replace(/`([^`]+)`/g, "<code>$1</code>")
			.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
			.replace(/\*([^*]+)\*/g, "<em>$1</em>")
			.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, "<a href=\"$2\">$1</a>");
	}

	function sanitizeMarkdownHtml(html) {
		var container = document.createElement("div");
		var allowed = {
			"A": ["href", "title"],
			"B": [],
			"BLOCKQUOTE": [],
			"BR": [],
			"CODE": [],
			"EM": [],
			"H1": [],
			"H2": [],
			"H3": [],
			"H4": [],
			"H5": [],
			"H6": [],
			"HR": [],
			"I": [],
			"LI": [],
			"OL": [],
			"P": [],
			"PRE": [],
			"STRONG": [],
			"TABLE": [],
			"TBODY": [],
			"TD": [],
			"TH": [],
			"THEAD": [],
			"TR": [],
			"UL": []
		};

		container.innerHTML = html;
		$(container).find("*").each(function() {
			var tag = this.tagName;
			var attrs = allowed[tag];
			var node = this;

			if (!attrs) {
				$(node).replaceWith(document.createTextNode($(node).text()));
				return;
			}

			$.each($.makeArray(node.attributes), function(_, attr) {
				if ($.inArray(attr.name, attrs) == -1) {
					node.removeAttribute(attr.name);
				}
			});

			if (tag == "A") {
				sanitizeLink(node);
			}
		});
		return container.innerHTML;
	}

	function sanitizeLink(node) {
		var href = node.getAttribute("href") || "";
		var clean = $.trim(href).toLowerCase();
		if (
			clean.indexOf("http://") !== 0 &&
			clean.indexOf("https://") !== 0 &&
			clean.indexOf("mailto:") !== 0 &&
			(clean.indexOf("/") !== 0 || clean.indexOf("//") === 0) &&
			clean.indexOf("#") !== 0
		) {
			node.removeAttribute("href");
			return;
		}
		if (clean.indexOf("http://") === 0 || clean.indexOf("https://") === 0) {
			node.setAttribute("target", "_blank");
			node.setAttribute("rel", "noopener noreferrer");
		}
	}

	function setBusy(isBusy, message) {
		button.prop("disabled", isBusy);
		input.prop("disabled", isBusy);
		if (!isBusy) {
			stopResponseTimer(false);
		}
		status.text(isBusy ? (message || "{{=T('Waiting for LLM response...')}}") : "");
	}

	function responseText(data) {
		if (!data) {
			return "";
		}
		if (data.message) {
			return data.message;
		}
		if (data.data && data.data.message) {
			return data.data.message;
		}
		if (data.data && data.data.answer) {
			return data.data.answer;
		}
		if (data.data && data.data.response) {
			return data.data.response;
		}
		if (data.answer) {
			return data.answer;
		}
		if (data.response) {
			return data.response;
		}
		if (data.error) {
			return valueText(data.error);
		}
		return valueText(data);
	}

	function responseToolCalls(data) {
		if (!data) {
			return [];
		}
		if ($.isArray(data.tool_calls)) {
			return data.tool_calls;
		}
		if (data.data && $.isArray(data.data.tool_calls)) {
			return data.data.tool_calls;
		}
		return [];
	}

	function valueText(value) {
		if (value === null || value === undefined) {
			return "";
		}
		if (typeof value === "string") {
			return value;
		}
		if (value.message) {
			return valueText(value.message);
		}
		if (value.detail) {
			return valueText(value.detail);
		}
		if (value.error) {
			return valueText(value.error);
		}
		try {
			return JSON.stringify(value, null, 2);
		} catch (e) {
			return String(value);
		}
	}

	function errorText(xhr) {
		var fallback = "{{=T('The AI request failed.')}}";
		if (!xhr || !xhr.responseText) {
			return fallback;
		}
		try {
			var data = JSON.parse(xhr.responseText);
			return valueText(data.error || data.detail || data) || fallback;
		} catch (e) {
			return xhr.responseText || fallback;
		}
	}

	function titleFromMessage(message) {
		message = $.trim(message || "").replace(/\s+/g, " ");
		if (message.length > 60) {
			return message.substring(0, 57) + "...";
		}
		return message || "{{=T('New conversation')}}";
	}

	function sendConversationMessageStream(message, assistantMessage) {
		if (!window.fetch || !window.TextDecoder || !window.ReadableStream) {
			return $.Deferred().reject({
				responseText: "{{=T('AI streaming is not supported by this browser.')}}"
			}).promise();
		}

		var deferred = $.Deferred();
		var answer = "";
		var finalData = null;
		var eventName = "message";
		var dataLines = [];

		function consumeEvent() {
			var raw;
			var data;
			if (dataLines.length === 0) {
				eventName = "message";
				return;
			}
			raw = dataLines.join("\n");
			dataLines = [];
			try {
				data = JSON.parse(raw);
			} catch (e) {
				deferred.reject({responseText: raw});
				return;
			}

			if (eventName == "delta") {
				answer += data.content || "";
				setAssistantMessageText(assistantMessage, answer);
			} else if (eventName == "tool_call") {
				setResponseTimerMessage("{{=T('Using Collector tools...')}}");
				if (!answer) {
					setAssistantMessageThinking(
						assistantMessage,
						"{{=T('Using Collector tools')}}"
					);
				}
			} else if (eventName == "done") {
				finalData = data;
				if (data.message) {
					answer = data.message;
					setAssistantMessageText(assistantMessage, answer);
				}
				appendToolCalls(assistantMessage, responseToolCalls(data));
			} else if (eventName == "error") {
				deferred.reject({responseText: valueText(data.error || data)});
			}
			eventName = "message";
		}

		function consumeText(text) {
			var lines = text.split(/\r?\n/);
			$.each(lines, function(_, line) {
				if (line === "") {
					consumeEvent();
				} else if (line.indexOf("event:") === 0) {
					eventName = $.trim(line.substring(6));
				} else if (line.indexOf("data:") === 0) {
					dataLines.push($.trim(line.substring(5)));
				}
			});
		}

		fetch(conversationUrl(currentConversationId, "chat/stream"), {
			method: "POST",
			credentials: "same-origin",
			headers: {
				"Content-Type": "application/json",
				"Accept": "text/event-stream"
			},
			body: JSON.stringify({
				message: message
			})
		}).then(function(response) {
			if (!response.ok) {
				return response.text().then(function(text) {
					deferred.reject({responseText: text});
				});
			}
			var reader = response.body.getReader();
			var decoder = new TextDecoder("utf-8");
			var pending = "";

			function read() {
				return reader.read().then(function(result) {
					var text;
					var lastBreak;
					if (result.done) {
						if (pending) {
							consumeText(pending);
						}
						if (dataLines.length > 0) {
							consumeEvent();
						}
						if (finalData) {
							deferred.resolve(finalData);
						} else {
							deferred.reject({
								responseText: "{{=T('The AI stream ended without a final response.')}}"
							});
						}
						return;
					}
					text = pending + decoder.decode(result.value, {stream: true});
					lastBreak = Math.max(text.lastIndexOf("\n"), text.lastIndexOf("\r"));
					if (lastBreak == -1) {
						pending = text;
					} else {
						consumeText(text.substring(0, lastBreak + 1));
						pending = text.substring(lastBreak + 1);
					}
					return read();
				});
			}

			return read();
		}).catch(function(exc) {
			deferred.reject({responseText: valueText(exc)});
		});

		return deferred.promise();
	}

	form.on("submit", function(event) {
		event.preventDefault();
		var message = $.trim(input.val());
		var assistantMessage;
		if (!message) {
			input.focus();
			return;
		}

		error.hide().text("");
		appendMessage("user", message);
		assistantMessage = appendMessage("assistant", "");
		setAssistantMessageThinking(assistantMessage);
		input.val("");
		setBusy(true);

		(
			currentConversationId ?
			$.Deferred().resolve().promise() :
			createConversation(titleFromMessage(message))
		).then(function() {
			renderConversations();
			startResponseTimer("{{=T('Thinking...')}}");
			return sendConversationMessageStream(message, assistantMessage);
		}).done(function(data) {
			loadConversations();
		}).fail(function(xhr) {
			error.text(errorText(xhr)).show();
		}).always(function() {
			stopResponseTimer(false);
			setBusy(false);
			input.focus();
		});
	});

	newButton.on("click", function() {
		currentConversationId = null;
		clearMessages();
		renderConversations();
		error.hide().text("");
		status.text("{{=T('New conversation')}}");
		input.focus();
	});

	loadConversations();
	input.focus();
})();
</script>
